[package]
name = "ledge"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Sticky notes that wait on the edge of the screen, for Wayland"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18", "gio_v2_80"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk4-layer-shell = "0.8"
libsecret = "0.9"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
aes-gcm = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
fancy-regex = "0.14"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
